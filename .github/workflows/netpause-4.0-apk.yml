name: NetPause 6.0 APK fast build

on:
  pull_request:
    branches: [main, netpause-4.0-preview]

permissions:
  contents: read

concurrency:
  group: netpause-6.0-apk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore validated NetPause 3.1 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/netpause-source"
          gh run download 45933298537 --repo "${{ github.repository }}" --name "NetPause-3.1-source" --dir "$RUNNER_TEMP/netpause-source"
          SOURCE_ZIP=$(find "$RUNNER_TEMP/netpause-source" -type f -name 'NetPause-3.1-source.zip' -print -quit)
          test -n "$SOURCE_ZIP"
          mkdir -p "$RUNNER_TEMP/netpause-workflows"
          cp .github/workflows/android-build.yml "$RUNNER_TEMP/netpause-workflows/android-build.yml"
          cp .github/workflows/netpause-4.0-apk.yml "$RUNNER_TEMP/netpause-workflows/netpause-4.0-apk.yml"
          unzip -oq "$SOURCE_ZIP" -d "$GITHUB_WORKSPACE"
          cp "$RUNNER_TEMP/netpause-workflows/android-build.yml" .github/workflows/android-build.yml
          cp "$RUNNER_TEMP/netpause-workflows/netpause-4.0-apk.yml" .github/workflows/netpause-4.0-apk.yml
          test -f app/build.gradle.kts
          test -f app/src/main/java/ru/netpause/app/MainActivity.kt

      - name: Apply NetPause 4.1 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/upgrade-4.0-part-*.b64 > "$RUNNER_TEMP/netpause-4.0.patch.xz.b64"
          base64 --decode "$RUNNER_TEMP/netpause-4.0.patch.xz.b64" > "$RUNNER_TEMP/netpause-4.0.patch.xz"
          EXPECTED=$(awk '{print $1}' .ci/upgrade-4.0.patch.xz.sha256)
          printf '%s  %s\n' "$EXPECTED" "$RUNNER_TEMP/netpause-4.0.patch.xz" | sha256sum --check -
          xz --decompress --stdout "$RUNNER_TEMP/netpause-4.0.patch.xz" > "$RUNNER_TEMP/netpause-4.0.patch"
          patch --batch --forward -p1 < "$RUNNER_TEMP/netpause-4.0.patch"
          grep -q 'versionName = "4.0"' app/build.gradle.kts
          grep -q 'versionCode = 22' app/build.gradle.kts
          grep -q 'applicationId = "ru.netpause.app"' app/build.gradle.kts

      - name: Apply NetPause 4.1 neon UI patch and logo
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/upgrade-4.1-part-*.b64 > "$RUNNER_TEMP/netpause-4.1.patch.xz.b64"
          base64 --decode "$RUNNER_TEMP/netpause-4.1.patch.xz.b64" > "$RUNNER_TEMP/netpause-4.1.patch.xz"
          EXPECTED=$(awk '{print $1}' .ci/upgrade-4.1.patch.xz.sha256)
          printf '%s  %s\n' "$EXPECTED" "$RUNNER_TEMP/netpause-4.1.patch.xz" | sha256sum --check -
          xz --decompress --stdout "$RUNNER_TEMP/netpause-4.1.patch.xz" > "$RUNNER_TEMP/netpause-4.1.patch"
          patch --batch --forward -p1 < "$RUNNER_TEMP/netpause-4.1.patch"
          mkdir -p app/src/main/res/drawable-nodpi
          cp .ci/netpause-brand.webp app/src/main/res/drawable-nodpi/netpause_brand.webp
          grep -q 'versionName = "4.1"' app/build.gradle.kts
          grep -q 'versionCode = 23' app/build.gradle.kts
          grep -q 'applicationId = "ru.netpause.app"' app/build.gradle.kts
      - name: Apply NetPause 5.0 usability and navigation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/upgrade-5.0-part-00.b64 .ci/upgrade-5.0-segment-*.b64 .ci/upgrade-5.0-part-02.b64 > "$RUNNER_TEMP/netpause-5.0.patch.xz.b64"
          base64 --decode "$RUNNER_TEMP/netpause-5.0.patch.xz.b64" > "$RUNNER_TEMP/netpause-5.0.patch.xz"
          EXPECTED=$(awk '{print $1}' .ci/upgrade-5.0.patch.xz.sha256)
          printf '%s  %s\n' "$EXPECTED" "$RUNNER_TEMP/netpause-5.0.patch.xz" | sha256sum --check -
          xz --decompress --stdout "$RUNNER_TEMP/netpause-5.0.patch.xz" > "$RUNNER_TEMP/netpause-5.0.patch"
          patch --batch --forward -p1 < "$RUNNER_TEMP/netpause-5.0.patch"
          grep -q 'versionName = "5.0"' app/build.gradle.kts
          grep -q 'versionCode = 24' app/build.gradle.kts
          grep -q 'applicationId = "ru.netpause.app"' app/build.gradle.kts

      - name: Apply NetPause 5.1 animated splash and interaction polish
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/upgrade-5.1-part-*.b64 > "$RUNNER_TEMP/netpause-5.1.patch.xz.b64"
          base64 --decode "$RUNNER_TEMP/netpause-5.1.patch.xz.b64" > "$RUNNER_TEMP/netpause-5.1.patch.xz"
          EXPECTED=$(awk '{print $1}' .ci/upgrade-5.1.patch.xz.sha256)
          printf '%s  %s\n' "$EXPECTED" "$RUNNER_TEMP/netpause-5.1.patch.xz" | sha256sum --check -
          xz --decompress --stdout "$RUNNER_TEMP/netpause-5.1.patch.xz" > "$RUNNER_TEMP/netpause-5.1.patch"
          patch --batch --forward -p1 < "$RUNNER_TEMP/netpause-5.1.patch"
          grep -q 'versionName = "5.1"' app/build.gradle.kts
          grep -q 'versionCode = 25' app/build.gradle.kts
          grep -q 'applicationId = "ru.netpause.app"' app/build.gradle.kts

      - name: Apply NetPause 6.0 modernization patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/upgrade-6.0-part-*.b64 > "$RUNNER_TEMP/netpause-6.0.patch.xz.b64"
          base64 --decode "$RUNNER_TEMP/netpause-6.0.patch.xz.b64" > "$RUNNER_TEMP/netpause-6.0.patch.xz"
          EXPECTED=$(awk '{print $1}' .ci/upgrade-6.0.patch.xz.sha256)
          printf '%s  %s\n' "$EXPECTED" "$RUNNER_TEMP/netpause-6.0.patch.xz" | sha256sum --check -
          xz --decompress --stdout "$RUNNER_TEMP/netpause-6.0.patch.xz" > "$RUNNER_TEMP/netpause-6.0.patch"
          patch --batch --forward -p1 < "$RUNNER_TEMP/netpause-6.0.patch"
          grep -q 'versionName = "6.0"' app/build.gradle.kts
          grep -q 'versionCode = 26' app/build.gradle.kts
          grep -q 'applicationId = "ru.netpause.app"' app/build.gradle.kts

      - name: Apply NetPause 6.0 compile fix
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -p1 < .ci/upgrade-6.0-fix1.patch

      - name: Apply NetPause 6.0.1 free mode, Google Play updates and UI polish
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/upgrade-6.0.1-part-*.b64 > "$RUNNER_TEMP/netpause-6.0.1.patch.xz.b64"
          base64 --decode "$RUNNER_TEMP/netpause-6.0.1.patch.xz.b64" > "$RUNNER_TEMP/netpause-6.0.1.patch.xz"
          EXPECTED=$(awk '{print $1}' .ci/upgrade-6.0.1.patch.xz.sha256)
          printf '%s  %s\n' "$EXPECTED" "$RUNNER_TEMP/netpause-6.0.1.patch.xz" | sha256sum --check -
          xz --decompress --stdout "$RUNNER_TEMP/netpause-6.0.1.patch.xz" > "$RUNNER_TEMP/netpause-6.0.1.patch"
          patch --batch --forward -p1 < "$RUNNER_TEMP/netpause-6.0.1.patch"
          grep -q 'versionName = "6.0.1"' app/build.gradle.kts
          grep -q 'versionCode = 27' app/build.gradle.kts
          grep -q 'applicationId = "ru.netpause.app"' app/build.gradle.kts

      - name: Apply NetPause 6.0.1 main button compile fix
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -p1 < .ci/upgrade-6.0.1-fix1.patch

      - name: Apply NetPause 6.0.2 ticker and animation fixes
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -p1 < .ci/upgrade-6.0.2-fix.patch
          grep -q 'versionName = "6.0.2"' app/build.gradle.kts
          grep -q 'versionCode = 28' app/build.gradle.kts

      - name: Apply NetPause 6.0.2 task ticker and seamless UI patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/upgrade-6.0.2-ui-part-*.b64 > "$RUNNER_TEMP/netpause-6.0.2-ui.patch.xz.b64"
          base64 --decode "$RUNNER_TEMP/netpause-6.0.2-ui.patch.xz.b64" > "$RUNNER_TEMP/netpause-6.0.2-ui.patch.xz"
          xz --decompress --stdout "$RUNNER_TEMP/netpause-6.0.2-ui.patch.xz" > "$RUNNER_TEMP/netpause-6.0.2-ui.patch"
          patch --batch --forward -p1 < "$RUNNER_TEMP/netpause-6.0.2-ui.patch"
          grep -q 'contentHost' app/src/main/java/ru/netpause/app/MainActivity.kt
          grep -q 'tickerKeepsTaskTextVisibleWhetherCheckboxIsCheckedOrNot' app/src/test/java/ru/netpause/app/TaskPlannerLogicTest.kt
          grep -q 'versionName = "6.0.2"' app/build.gradle.kts
          grep -q 'versionCode = 28' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK_SRC=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK_SRC"
          cp "$APK_SRC" dist/NetPause-6.0.2-debug.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BT/aapt2" dump badging dist/NetPause-6.0.2-debug.apk > dist/badging.txt
          grep -q "name='ru.netpause.app'" dist/badging.txt
          grep -q "versionCode='28'" dist/badging.txt
          grep -q "versionName='6.0.2'" dist/badging.txt
          "$BT/apksigner" verify --verbose --print-certs dist/NetPause-6.0.2-debug.apk > dist/signing.txt
          sha256sum dist/NetPause-6.0.2-debug.apk > dist/sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetPause-6.0.2-debug-apk
          path: |
            dist/NetPause-6.0.2-debug.apk
            dist/badging.txt
            dist/signing.txt
            dist/sha256.txt
          if-no-files-found: error
          retention-days: 30
