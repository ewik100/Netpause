name: NetPause Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netpause-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore NetPause 2.1 project sources
        shell: bash
        run: |
          set -euo pipefail
          test -s .ci/part-01.b64
          cat .ci/part-*.b64 > "$RUNNER_TEMP/netpause-source.tar.xz.b64"
          base64 --decode "$RUNNER_TEMP/netpause-source.tar.xz.b64" > "$RUNNER_TEMP/netpause-source.tar.xz"
          printf '%s  %s\n' '90bc4c59ff5b8970a48ed845d1633587c2df2db6d7e81cfdb44dd9e8ecb7a153' "$RUNNER_TEMP/netpause-source.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/netpause-source.tar.xz" -C "$GITHUB_WORKSPACE"
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.ACCESS_NETWORK_STATE' app/src/main/AndroidManifest.xml; then
            sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' app/src/main/AndroidManifest.xml
          fi
          if ! grep -q 'xmlns:tools=' app/src/main/AndroidManifest.xml; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">#' app/src/main/AndroidManifest.xml
          fi
          if ! grep -q 'tools:ignore="ForegroundServicePermission"' app/src/main/AndroidManifest.xml; then
            sed -i '/android:name=".BlockVpnService"/ s#android:name=".BlockVpnService"#android:name=".BlockVpnService" tools:ignore="ForegroundServicePermission"#' app/src/main/AndroidManifest.xml
          fi
          test -s .ci/upgrade-1.9.patch.gz.b64
          base64 --decode .ci/upgrade-1.9.patch.gz.b64 | gzip --decompress | patch --batch --forward -p1
          test -s .ci/upgrade-2.0-part-00.b64
          cat .ci/upgrade-2.0-part-*.b64 | base64 --decode > "$RUNNER_TEMP/netpause-upgrade-2.0.patch.xz"
          test -s .ci/upgrade-2.0.patch.xz.sha256
          EXPECTED_PATCH_SHA=$(tr -d '[:space:]' < .ci/upgrade-2.0.patch.xz.sha256)
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA" "$RUNNER_TEMP/netpause-upgrade-2.0.patch.xz" | sha256sum -c -
          xz --decompress --stdout "$RUNNER_TEMP/netpause-upgrade-2.0.patch.xz" > "$RUNNER_TEMP/netpause-upgrade-2.0.patch"
          patch --batch --forward -p1 < "$RUNNER_TEMP/netpause-upgrade-2.0.patch"
          test -s .ci/upgrade-2.1-part-00.b64
          cat .ci/upgrade-2.1-part-*.b64 | base64 --decode > "$RUNNER_TEMP/netpause-upgrade-2.1.patch.xz"
          EXPECTED_PATCH_SHA=$(tr -d '[:space:]' < .ci/upgrade-2.1.patch.xz.sha256)
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA" "$RUNNER_TEMP/netpause-upgrade-2.1.patch.xz" | sha256sum -c -
          xz --decompress --stdout "$RUNNER_TEMP/netpause-upgrade-2.1.patch.xz" > "$RUNNER_TEMP/netpause-upgrade-2.1.patch"
          patch --batch --forward -p1 < "$RUNNER_TEMP/netpause-upgrade-2.1.patch"
          rm -rf .ci
          echo "NetPause 2.1 sources restored."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          NAME=$(awk -F '"' '/versionName[[:space:]]*=/{print $2; exit}' app/build.gradle.kts)
          CODE=$(awk '/versionCode[[:space:]]*=/{gsub(/[^0-9]/,""); print; exit}' app/build.gradle.kts)
          test -n "$NAME" && test -n "$CODE"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building NetPause $NAME (versionCode $CODE)"

      - name: Prepare optional persistent signing key
        id: signing
        shell: bash
        env:
          NETPAUSE_KEYSTORE_BASE64: ${{ secrets.NETPAUSE_KEYSTORE_BASE64 }}
          NETPAUSE_KEYSTORE_PASSWORD: ${{ secrets.NETPAUSE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$NETPAUSE_KEYSTORE_BASE64" && -n "$NETPAUSE_KEYSTORE_PASSWORD" ]]; then
            printf '%s' "$NETPAUSE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/netpause-signing.p12"
            test -s "$RUNNER_TEMP/netpause-signing.p12"
            chmod 600 "$RUNNER_TEMP/netpause-signing.p12"
            echo 'persistent=true' >> "$GITHUB_OUTPUT"
            echo 'Persistent signing key configured.'
          else
            echo 'persistent=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Persistent signing key is not configured; APK will use the CI debug key and may not update an existing installation.'
          fi

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon lintDebug

      - name: Build debug APK
        env:
          NETPAUSE_KEYSTORE_FILE: ${{ runner.temp }}/netpause-signing.p12
          NETPAUSE_KEYSTORE_PASSWORD: ${{ secrets.NETPAUSE_KEYSTORE_PASSWORD }}
          NETPAUSE_KEY_ALIAS: netpause
        run: gradle --no-daemon assembleDebug

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          APK_SRC=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK_SRC"
          mkdir -p dist
          APK="dist/NetPause-${{ steps.version.outputs.name }}-debug.apk"
          cp "$APK_SRC" "$APK"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$BT/aapt2"
          test -x "$BT/apksigner"
          "$BT/aapt2" dump badging "$APK" > dist/badging.txt
          grep -q "name='ru.netpause.app'" dist/badging.txt
          grep -q "versionCode='${{ steps.version.outputs.code }}'" dist/badging.txt
          grep -q "versionName='${{ steps.version.outputs.name }}'" dist/badging.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" > dist/signing.txt
          sha256sum "$APK" | tee dist/sha256.txt
          cat dist/signing.txt

      - name: Archive complete source project
        shell: bash
        run: |
          set -euo pipefail
          zip -qr "dist/NetPause-${{ steps.version.outputs.name }}-source.zip" . -x '.git/*' '.gradle/*' '*/build/*' 'app/build/*' 'dist/*' '.idea/*' '*.iml' 'local.properties'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetPause-${{ steps.version.outputs.name }}-debug-apk
          path: |
            dist/NetPause-${{ steps.version.outputs.name }}-debug.apk
            dist/signing.txt
            dist/sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetPause-${{ steps.version.outputs.name }}-source
          path: dist/NetPause-${{ steps.version.outputs.name }}-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetPause-${{ steps.version.outputs.name }}-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 30
