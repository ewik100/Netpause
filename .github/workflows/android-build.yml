name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare optional persistent signing key
        shell: bash
        run: |
          if [ -n "$NETPAUSE_KEYSTORE_BASE64" ]; then
            printf '%s' "$NETPAUSE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/netpause-signing.p12"
            test -s "$RUNNER_TEMP/netpause-signing.p12"
            chmod 600 "$RUNNER_TEMP/netpause-signing.p12"
            echo "Persistent signing key detected."
          else
            echo "::warning::No persistent signing key configured. This APK will use a temporary debug key and cannot be installed as an in-place update to a differently signed build."
          fi
        env:
          NETPAUSE_KEYSTORE_BASE64: ${{ secrets.NETPAUSE_KEYSTORE_BASE64 }}

      - name: Build NetPause 1.5 APK
        env:
          NETPAUSE_KEYSTORE_FILE: ${{ runner.temp }}/netpause-signing.p12
          NETPAUSE_KEYSTORE_PASSWORD: ${{ secrets.NETPAUSE_KEYSTORE_PASSWORD }}
          NETPAUSE_KEY_ALIAS: netpause
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetPause-1.5-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
